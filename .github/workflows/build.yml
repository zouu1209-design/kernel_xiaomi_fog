name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip clang llvm

      - name: Compile Kernel
        run: |
          mkdir out
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 fog-stock_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image.gz*
