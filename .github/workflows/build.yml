name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip libelf-dev libssl-dev

      - name: Download Toolchains
        run: |
          git clone --depth=1 https://gitlab.com/mvaisakh/clang-builds.git -b release/14.x clang
          git clone --depth=1 https://github.com/StagOS/aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/StagOS/arm-linux-androideabi-4.9.git gcc32

      - name: Compile Kernel
        run: |
          mkdir out
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"
          
          make O=out ARCH=arm64 fog-stock_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image.gz*
